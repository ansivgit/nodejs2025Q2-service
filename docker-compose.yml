    # command: npm run start:dev

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: always
    env_file:
      - '.env'
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    networks:
      - my_network

volumes:
  postgres-data:
  postgres-logs:

networks:
  my_network:
    driver: bridge
