services:
  app:
    image: ansiv/myapp:latest
    container_name: node-app-prod
    restart: always
    env_file:
      - '.env'
    ports:
      - '${PROD_PORT}:${PROD_PORT}'
    depends_on:
      - postgres
    networks:
      - my_network

  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: always
    env_file:
      - '.env'
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-logs:/var/log/postgresql
    networks:
      - my_network

volumes:
  postgres-data:
  postgres-logs:

networks:
  my_network:
    driver: bridge
